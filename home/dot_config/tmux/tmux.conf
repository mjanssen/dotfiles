set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

# unbind C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# set -g status-style 'bg=#333333 fg=#5eacd3'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
set -g base-index 1

# Set styles for bottom status bar
set -g status-style 'fg=#4a6fd9'
set -g status-left '#[fg=#ff2bd6,bold]#S#[fg=#1f3a8a,nobold] // '
set -g status-right '#[fg=#4a6fd9]%H:%M#[fg=#1f3a8a] // #[fg=#4a6fd9]%d-%m-%Y'
set -g window-status-style 'fg=#4a6fd9'
set -g window-status-current-style 'fg=#ff2bd6,bold'
set -g window-status-activity-style 'fg=#00e5ff'
set -g message-style 'fg=#ff2bd6,bg=default'
set -g message-command-style 'fg=#00e5ff,bg=default'
set -g mode-style 'fg=#0a0f2c,bg=#ff2bd6'
set -g status-right-length 20
set -g status-left-length 20

# border colours: neon sign at night, hot pink tube around the active pane,
# dim electric blue for the rest
set -g pane-border-lines heavy
set -g pane-border-style "fg=#1f3a8a"
set -g pane-active-border-style "fg=#ff2bd6,bold"
set -g display-panes-colour "#1f3a8a"
set -g display-panes-active-colour "#ff2bd6"

# disable repeat time for window switching
set-option -g repeat-time 0

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# vim-like window resizing
bind -r C-u resize-pane -L 10
bind -r C-p resize-pane -R 10
bind -r C-i resize-pane -U 10
bind -r C-o resize-pane -D 10

# Set scrollback buffer to 10000
set -g history-limit 10000

# Set mouse scroll
set -g mouse off

# tmux cht.sh helper
bind-key -r i run-shell "tmux neww ~/.config/tmux/tmux-cht.sh"

# Primeagen sessionizer
bind-key -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer.sh"

# Which pane is each Neovim session in, and what it and its language servers
# cost in RAM and CPU, plus language servers running outside nvim. Catches
# sessions suspended with Ctrl-Z, which pane_current_command hides. Live view:
# enter jumps to the pane, x kills the selected process, q or Esc closes.
bind-key N display-popup -E -w 90% -h 80% "nvim-sessions"
